name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Lint
      run: npm run lint

    - name: Typecheck
      run: npm run typecheck

    - name: Build
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
        SUPABASE_SERVICE_ROLE_KEY: "placeholder"
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_placeholder"
        CLERK_SECRET_KEY: "sk_test_placeholder"
        CLERK_WEBHOOK_SIGNING_SECRET: "whsec_placeholder"
        STRIPE_SECRET_KEY: "sk_test_placeholder"
        STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
        PUSH_WEBHOOK_SECRET: "placeholder"
        # Valid-format 65-byte public key
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: "BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U"
        # Valid-format 32-byte private key
        VAPID_PRIVATE_KEY: "yYV1u8gD4E8P6B5s7Z3t9X2c4V0b1N8m5L7kJ6h5G4fA"
        VAPID_SUBJECT: "mailto:test@example.com"

    - name: Test
      run: npm run test:run
